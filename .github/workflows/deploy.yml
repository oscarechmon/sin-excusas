# Despliegue del ERP + web pública a Hostinger por FTP.
#
# Se ejecuta en cada push a `main` (o a mano desde la pestaña Actions):
#   1. instala las dependencias PHP de producción (vendor/),
#   2. compila el panel Vue con Vite (public/build/),
#   3. sube por FTP solo los archivos que cambiaron a public_html/erp/.
#
# Lo que NO hace (se corre una vez por SSH, ver README de despliegue):
#   - crear el .env del servidor,
#   - ejecutar las migraciones (php artisan migrate),
#   - crear el enlace public/storage.
name: Deploy ERP a Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

# Si llegan dos pushes seguidos, el segundo espera al primero: dos subidas
# FTP simultáneas a la misma carpeta dejarían archivos a medias.
concurrency:
  group: deploy-erp
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Preparar PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, intl, bcmath, gd, pdo_mysql, zip
          tools: composer:v2
          coverage: none

      - name: Instalar dependencias PHP (sin dev)
        # bootstrap/cache está en .gitignore: sin la carpeta, package:discover falla.
        run: |
          mkdir -p bootstrap/cache storage/framework/{cache/data,sessions,views} storage/logs
          composer install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader

      - name: Preparar Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Compilar el panel (Vite)
        run: |
          npm ci
          npm run build

      - name: Subir por FTP a public_html/erp
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./
          server-dir: erp/
          # El estado de sincronización vive en el servidor: en cada deploy
          # solo se suben los archivos que cambiaron desde el anterior.
          state-name: .ftp-deploy-sync-state.json
          exclude: |
            **/.git*
            **/.git*/**
            node_modules/**
            tests/**
            .github/**
            .env
            .env.*
            .editorconfig
            eslint.config.js
            tsconfig*.json
            vite.config.ts
            package-lock.json
            phpunit.xml
            README.md
            ERP_Sin_Excusas_Especificacion_Claude.md
            resources/js/**
            resources/scss/**
            public/hot
            # Datos del servidor que nunca deben pisarse ni borrarse. Los patrones
            # [!.]* dejan pasar los .gitignore, que son los que crean las carpetas.
            storage/app/public/[!.]*
            storage/app/public/[!.]*/**
            storage/app/private/[!.]*
            storage/app/private/[!.]*/**
            storage/logs/[!.]*
            storage/framework/cache/data/[!.]*
            storage/framework/cache/data/[!.]*/**
            storage/framework/sessions/[!.]*
            storage/framework/views/[!.]*
            storage/framework/testing/**
            public/storage
