# Despliegue del ERP + web pública a Hostinger (sinexcusas.org.pe).
#
# Se ejecuta en cada push a `main` (o a mano desde la pestaña Actions):
#   1. instala las dependencias PHP de producción (vendor/),
#   2. compila el panel Vue con Vite (public/build/),
#   3. empaqueta todo en un único release.zip,
#   4. lo sube por FTP y le pide al servidor que lo descomprima, migre y cachee.
#
# Por qué un zip y no una subida archivo por archivo: vendor/ son más de doce
# mil archivos y el FTP de Hostinger cierra la sesión a los 3600 segundos, así
# que la subida nunca llegaba al final. Un zip son dos minutos.
#
# Lo que NO hace (ver DEPLOY.md, se hace una sola vez):
#   - crear el .env del servidor,
#   - generar APP_KEY,
#   - crear el enlace public/storage.
name: Deploy a sinexcusas.org.pe

on:
  push:
    branches: [main]
  workflow_dispatch:

# Si llegan dos pushes seguidos, el segundo espera: dos publicaciones a la vez
# dejarían la carpeta a medias.
concurrency:
  group: deploy-sinexcusas
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Comprobar que están los secretos
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
          DEPLOY_URL: ${{ secrets.DEPLOY_URL }}
        run: |
          faltan=""
          for secreto in FTP_SERVER FTP_USERNAME FTP_PASSWORD DEPLOY_TOKEN DEPLOY_URL; do
            if [ -z "${!secreto}" ]; then faltan="$faltan $secreto"; fi
          done
          if [ -n "$faltan" ]; then
            echo "Faltan estos secretos en GitHub (Settings → Secrets → Actions):$faltan"
            echo "Sin ellos el servidor no puede publicar la versión. Ver DEPLOY.md."
            exit 1
          fi

      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Preparar PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, bcmath, gd, pdo_mysql, zip
          tools: composer:v2
          coverage: none

      - name: Instalar dependencias PHP (sin dev)
        # bootstrap/cache está en .gitignore: sin la carpeta, package:discover falla.
        run: |
          mkdir -p bootstrap/cache storage/framework/{cache/data,sessions,views} storage/logs
          composer install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader

      - name: Preparar Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Compilar el panel (Vite)
        run: |
          npm ci
          npm run build

      - name: Empaquetar la versión
        # Se copia a una carpeta aparte para no arrastrar lo que no va al
        # servidor, y se comprime desde dentro para que las rutas del zip
        # queden relativas a la raíz del proyecto.
        run: |
          rsync -a --exclude-from=.deployignore ./ /tmp/release/
          cd /tmp/release
          zip -rq "$GITHUB_WORKSPACE/release.zip" . -x '.git/*'
          cd "$GITHUB_WORKSPACE"
          echo "Paquete: $(du -h release.zip | cut -f1), $(unzip -l release.zip | tail -1 | awk '{print $2}') archivos"

      - name: Subir el paquete por FTP
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        # --ssl cifra la sesión si el servidor lo admite y continúa en claro si
        # no; --ftp-pasv es lo que espera Hostinger detrás de su cortafuegos.
        run: |
          # El valor de FTP_SERVER sale tapado en el registro por ser secreto,
          # así que los errores de curl se traducen a algo accionable.
          # Si el secreto se pegó con Enter al final, GitHub guarda el salto de
          # línea y la URL queda partida (curl 3). Un nombre de servidor no
          # lleva espacios, así que se limpian sin riesgo.
          FTP_SERVER=$(printf '%s' "$FTP_SERVER" | tr -d '[:space:]')

          # El `|| codigo=$?` es lo que evita que `bash -e` corte el paso antes
          # de poder explicar el error.
          codigo=0
          curl --fail --silent --show-error --ssl --ftp-pasv --retry 3 --retry-delay 10 \
            --max-time 900 \
            --user "$FTP_USERNAME:$FTP_PASSWORD" \
            --upload-file release.zip \
            "ftp://$FTP_SERVER/release.zip" || codigo=$?

          if [ "$codigo" -eq 0 ]; then
            echo "Paquete subido."
            exit 0
          fi

          case "$codigo" in
            6) echo "FTP_SERVER no resuelve. Debe ser el nombre del servidor de"
               echo "Hostinger (algo.hstgr.io), no ftp.tudominio: el dominio apunta"
               echo "al CDN, que no habla FTP. Ver DEPLOY.md." ;;
            3) echo "FTP_SERVER trae caracteres que rompen la URL. Debe ser solo"
               echo "el nombre del servidor, sin ftp:// ni barras." ;;
            7) echo "FTP_SERVER resuelve pero no acepta la conexión en el puerto 21." ;;
            67) echo "Usuario o contraseña FTP rechazados. El usuario lleva su"
                echo "sufijo (algo.dominio) y la contraseña distingue mayúsculas." ;;
            60) echo "El certificado no valida: FTP_SERVER tiene una IP en vez del"
                echo "nombre del servidor (algo.hstgr.io), que es para quien está"
                echo "emitido el certificado." ;;
            *) echo "La subida falló. Ver DEPLOY.md, apartado 'Si algo falla'." ;;
          esac
          exit 1

      - name: Publicar en el servidor
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
          DEPLOY_URL: ${{ secrets.DEPLOY_URL }}
        # El servidor descomprime por tandas para no pasarse del tiempo máximo
        # de PHP; aquí se le llama hasta que responde done:true.
        run: |
          DEPLOY_URL=$(printf '%s' "$DEPLOY_URL" | tr -d '[:space:]')

          for intento in $(seq 1 60); do
            respuesta=$(curl --fail-with-body --silent --show-error --max-time 300 \
              -X POST -H "X-Deploy-Token: $DEPLOY_TOKEN" \
              "${DEPLOY_URL%/}/deploy/release") || { echo "$respuesta"; exit 1; }
            echo "$respuesta"
            case "$respuesta" in
              *'"done":true'*) echo "Publicado."; exit 0 ;;
            esac
          done
          echo "El servidor no terminó de descomprimir en 60 llamadas."
          exit 1
