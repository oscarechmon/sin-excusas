<?xml version="1.0" encoding="UTF-8"?>
<!--
  Logotipo provisional de Sin Excusas.
  Monograma «SE» en dorado, sin fondo: funciona sobre claro y sobre oscuro.
  Sustituir por el logotipo definitivo manteniendo el mismo nombre de archivo.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120"
     role="img" aria-label="Sin Excusas">
  <defs>
    <linearGradient id="seGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#8C6E36"/>
      <stop offset="45%"  stop-color="#D8B879"/>
      <stop offset="100%" stop-color="#8C6E36"/>
    </linearGradient>
  </defs>

  <circle cx="60" cy="60" r="55" fill="none" stroke="url(#seGold)" stroke-width="1.5"/>
  <circle cx="60" cy="60" r="48" fill="none" stroke="url(#seGold)" stroke-width="0.75" opacity="0.55"/>

  <text x="60" y="70" text-anchor="middle"
        font-family="Cormorant Garamond, Georgia, serif" font-size="42" font-weight="500"
        letter-spacing="2" fill="url(#seGold)">SE</text>

  <text x="60" y="90" text-anchor="middle"
        font-family="Jost, system-ui, sans-serif" font-size="7" letter-spacing="3.2"
        fill="#B08D4B">SIN EXCUSAS</text>
</svg>
